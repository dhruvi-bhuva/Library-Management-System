<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Review - {{ book.title }}</title>
    <style>
        :root {
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --success: #198754;
            --star-gold: #f59e0b;
            --star-gray: #d1d5db;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            line-height: 1.6;
            padding: 40px 16px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .product-strip {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .product-thumb {
            width: 55px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product-thumb-placeholder {
            width: 55px;
            height: 75px;
            background: #e2e8f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .interactive-stars {
            display: flex;
            gap: 6px;
            font-size: 32px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .interactive-star {
            color: var(--star-gray);
            transition: color 0.15s ease-in-out;
        }

        .interactive-star.active {
            color: var(--star-gold);
        }

        .rating-select {
            display: none;
        }

        textarea.form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        textarea.form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #475569;
        }

        .btn-outline:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">✏️ Edit Your Review</h1>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 18px;">
            Update your rating or thoughts about this book.
        </p>

        <!-- Product Summary Strip -->
        <div class="product-strip">
            {% if book.image %}
                <img src="{{ book.image.url }}" alt="{{ book.title }}" class="product-thumb">
            {% else %}
                <div class="product-thumb-placeholder">📖</div>
            {% endif %}
            <div>
                <strong style="font-size: 15px; color: #0f172a;">{{ book.title }}</strong>
                <div style="font-size: 13px; color: #64748b;">Author: {{ book.author.name }}</div>
                <div style="font-size: 13px; color: var(--success); font-weight: 600;">₹{{ book.price }}</div>
            </div>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Your Rating (1 to 5 Stars):</label>
                <div class="interactive-stars" id="star-selector">
                    <span class="interactive-star" data-value="1">★</span>
                    <span class="interactive-star" data-value="2">★</span>
                    <span class="interactive-star" data-value="3">★</span>
                    <span class="interactive-star" data-value="4">★</span>
                    <span class="interactive-star" data-value="5">★</span>
                </div>
                <select name="rating" id="rating-input" class="rating-select" required>
                    <option value="5" {% if review.rating == 5 %}selected{% endif %}>5 Stars</option>
                    <option value="4" {% if review.rating == 4 %}selected{% endif %}>4 Stars</option>
                    <option value="3" {% if review.rating == 3 %}selected{% endif %}>3 Stars</option>
                    <option value="2" {% if review.rating == 2 %}selected{% endif %}>2 Stars</option>
                    <option value="1" {% if review.rating == 1 %}selected{% endif %}>1 Star</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="review">Your Review:</label>
                <textarea name="review" id="review" rows="5" class="form-control" required>{{ review.review }}</textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">
                    💾 Save Changes
                </button>
                <a href="{% url 'book_detail' book.id %}" class="btn btn-outline">
                    Cancel
                </a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selector = document.getElementById('star-selector');
            const selectField = document.getElementById('rating-input');

            if (selector && selectField) {
                const stars = selector.querySelectorAll('.interactive-star');

                function updateStars(val) {
                    stars.forEach(star => {
                        const starVal = parseInt(star.getAttribute('data-value'), 10);
                        if (starVal <= val) {
                            star.classList.add('active');
                            star.textContent = '★';
                        } else {
                            star.classList.remove('active');
                            star.textContent = '☆';
                        }
                    });
                }

                stars.forEach(star => {
                    star.addEventListener('click', function() {
                        const val = parseInt(this.getAttribute('data-value'), 10);
                        selectField.value = val;
                        updateStars(val);
                    });

                    star.addEventListener('mouseenter', function() {
                        const val = parseInt(this.getAttribute('data-value'), 10);
                        updateStars(val);
                    });
                });

                selector.addEventListener('mouseleave', function() {
                    const currentVal = parseInt(selectField.value, 10) || 5;
                    updateStars(currentVal);
                });

                // Initialize with current review rating
                updateStars(parseInt(selectField.value, 10) || {{ review.rating }});
            }
        });
    </script>
</body>
</html>
